<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir</title>
    <!-- ➡️ TRUQUE DE CACHE: O ?v=3 força a TV a baixar o visual novo -->
    <link rel="stylesheet" href="style.css?v=14">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141414">
</head>

<body>

    <div id="app">
        <header>
            <div class="logo">🎬 Assistir</div>
            <div class="acoes">
                <button id="btnFavoritos">❤ Favoritos</button>
            </div>
        </header>

        <section class="busca">
            <input type="text" id="pesquisa" placeholder="Pesquisar filme ou série...">
        </section>

        <section id="letras">
            <button>A</button><button>B</button><button>C</button><button>D</button><button>E</button>
            <button>F</button><button>G</button><button>H</button><button>I</button><button>J</button>
            <button>K</button><button>L</button><button>M</button><button>N</button><button>O</button>
            <button>P</button><button>Q</button><button>R</button><button>S</button><button>T</button>
            <button>U</button><button>V</button><button>W</button><button>X</button><button>Y</button>
            <button>Z</button><button>#</button>
        </section>

        <main id="listaFilmes"></main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitulo"></h2>
            
            <div id="seletorTemporadas Container" style="margin-bottom: 15px; display: none;">
                <label for="seletorTemporadas" style="display:block; margin-bottom:5px; color:#aaa;">Temporada:</label>
                <select id="seletorTemporadas"></select>
            </div>

            <div id="modalLinks"></div>
            <button id="fecharModal">Fechar</button>
        </div>
    </div>

<!-- Player de Vídeo Nativo Embutido -->
    <div id="playerContainer" class="player-container">
        <span id="fecharPlayer" class="fechar-player">✕ Fechar Player</span>
        
        <!-- NOVO BOTÃO DE FUGA DIRETO PRO VLC -->
        <a id="linkExterno" class="fechar-player" style="right: auto; left: 20px; background: #ff9800; text-decoration: none;" href="#">🎬 Abrir no VLC / Player Externo</a>
        
        <h3 id="playerTitulo"></h3>
        
        <!-- Tirei a palavra "controls" daqui para a barra nativa do Android sumir de vez -->
        <video id="videoPlayer" autoplay controlsList="nodownload"></video>

        <!-- ➡️ A NOVA BARRA DE TEMPO CUSTOMIZADA PARA TV -->
        <div id="controlesNativosTV" class="controles-tv">
            <div class="tempo-texto">
                <span id="tempoAtual">00:00</span> / <span id="tempoTotal">00:00</span>
            </div>
            <div class="barra-fundo">
                <div class="barra-progresso" id="barraProgresso"></div>
            </div>
        </div>
    </div>

    <!-- ➡️ TRUQUE DE CACHE: O ?v=3 força a TV a baixar o motor anti-bloqueio -->
    <script src="app.js?v=14"></script>
</body>
</html>
